name: FundOS mobile snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build mobile snapshot
        env:
          FUNDOS_LLM_API_KEY: \${{ secrets.FUNDOS_LLM_API_KEY }}
          FUNDOS_LLM_BASE_URL: \${{ secrets.FUNDOS_LLM_BASE_URL }}
          FUNDOS_LLM_MODEL: \${{ secrets.FUNDOS_LLM_MODEL }}
        run: python export_mobile_snapshot.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
